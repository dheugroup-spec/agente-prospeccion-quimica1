name: Ejecutar Agente de Prospeccion

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta automáticamente todos los días a las 8:00 AM UTC
  workflow_dispatch: # Nos crea un botón para ejecutarlo a mano cuando queramos

jobs:
  ejecutar-agente:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Ejecutar script de Python
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python agente.py
